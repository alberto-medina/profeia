services:
  - type: web
    name: profeia-api
    env: docker
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: ENTORNO
        value: desarrollo
      - key: IA_CONTENIDO_FALLBACK_LOCAL
        value: "true"
      - key: BACKEND_PUBLIC_URL
        value: https://profeia-api.onrender.com
